
services:
  nginx:
    image: nginx:1.28
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - proxy-network
      - backend-network
    depends_on:
      - users
      - products
      - orders

  users:
    build: ./users
    networks:
      - backend-network
    expose:
      - "8000"

  products:
    build: ./products
    networks:
      - backend-network
    expose:
      - "8000"

  orders:
    build: ./orders
    networks:
      - backend-network
    expose:
      - "8000"

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-network

networks:
  proxy-network:
    driver: bridge

  backend-network:
    driver: bridge
    internal: true

volumes:
  postgres-data:
